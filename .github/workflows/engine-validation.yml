name: Engine Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, live-transition-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript + Vite build
        run: npm run build

      - name: Full Vitest suite
        run: npx vitest run
