name: Engine Validation

on:
  push:
    branches:
      - main
      - "fix/**"
      - live-v2-foundation
  pull_request:
    branches:
      - main
      - live-v2-foundation
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npx vitest run
