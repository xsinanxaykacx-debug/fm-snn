name: Engine Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, live-transition-v1, fix/live-engine-game-integration]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript + Vite build
        run: npm run build

      - name: Core live-engine tests
        run: >
          npx vitest run
          src/engine/live/transitionResolution.test.ts
          src/engine/live/counterPressChain.test.ts
          src/engine/live/counterPressLooseBallRecovery.test.ts
          src/engine/live/dirtyTackleLooseBall.test.ts
          src/engine/live/physics.test.ts
          src/engine/live/transitionIntegration.test.ts
          src/engine/live/shotGoalkeeperSeparation.test.ts
          src/engine/live/customFormationPosition.test.ts
          src/engine/live/liveResultIdentity.test.ts
          src/engine/live/finalValidation1.test.ts
          src/engine/live/liveMatchCalibration.test.ts
          src/engine/live/dSeedDiscovery.tmp.test.ts

      - name: Core match-engine tests
        run: >
          npx vitest run
          src/engine/match/simulate.test.ts
          src/engine/match/teamStrength.test.ts
          src/engine/match/qualityImpact.test.ts
          src/engine/match/defensiveBalance.test.ts
          src/engine/match/edgeCase.test.ts
          src/engine/match/chanceToShotCalibration.test.ts
          src/engine/match/performance.test.ts
