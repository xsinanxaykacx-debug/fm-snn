name: Engine Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [debug/bug020-boundary-runtime]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Temporary BUG-020 runtime trace
      - name: Debug Trace
        run: npx vitest run src/engine/live/debug-trace.test.ts
