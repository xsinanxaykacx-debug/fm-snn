name: Engine Validation

on:
  push:
    branches:
      - "debug/bug020-runtime"
  pull_request:
    branches:
      - "debug/bug020-runtime"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: BUG-020 debug trace
        run: npx vitest run src/engine/live/debug-trace.test.ts --reporter=verbose
